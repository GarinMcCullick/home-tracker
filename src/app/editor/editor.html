<div class="editor">
  <app-editor-toolbar
    [activeTool]="activeTool"
    [canDelete]="canDelete"
    (toolSelected)="setTool($event)"
    (deleteClicked)="deleteSelected()"
  ></app-editor-toolbar>

  <app-floor-plan
    [activeTool]="activeTool"
    [selectedWallId]="selectedWallId"
    (wallSelected)="onWallSelected($event)"
  ></app-floor-plan>
</div>
