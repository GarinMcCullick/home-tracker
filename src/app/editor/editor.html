<div class="editor" [class]="getCursorClass()">
  <div class="toolbar">
    <button [class.active]="editorStateService.activeTool === 'select'" (click)="setTool('select')">
      Select
    </button>
    <button [class.active]="editorStateService.activeTool === 'wall'" (click)="setTool('wall')">
      Wall
    </button>
    <button [class.active]="editorStateService.activeTool === 'room'" (click)="setTool('room')">
      Room
    </button>
    <button [class.active]="editorStateService.activeTool === 'door'" (click)="setTool('door')">
      Door
    </button>
    <button [class.active]="editorStateService.activeTool === 'window'" (click)="setTool('window')">
      Window
    </button>
    <button [class.active]="editorStateService.activeTool === 'sensor'" (click)="setTool('sensor')">
      Sensor
    </button>
    <button
      [disabled]="
        !editorStateService.selectedWallId &&
        !editorStateService.selectedDoorId &&
        !editorStateService.selectedWindowId &&
        !editorStateService.selectedRoomId
      "
      (click)="deleteSelected()"
      *ngIf="getSelectedType()"
    >
      Delete
    </button>
  </div>

  <div class="workspace">
    <div>Walls: {{ propertyService.property.walls.length }}</div>
    @if (editorStateService.selectedRoomId) {
      <div class="room-properties">
        <input [value]="getSelectedRoom()?.name ?? ''" (input)="renameSelectedRoom($event)" />

        <div>
          Area:
          {{ getSelectedRoom()?.area | number: '1.0-0' }}
        </div>
      </div>
    }
    <svg
      class="floor-plan"
      viewBox="0 0 1200 800"
      preserveAspectRatio="none"
      (click)="onSvgClick($event)"
      (mousedown)="onCanvasMouseDown($event)"
      (mousemove)="onMouseMove($event)"
      (mouseup)="onCanvasMouseUp($event)"
      (mouseleave)="onCanvasMouseUp($event)"
      (wheel)="onWheel($event)"
    >
      <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path
            d="M 20 0 L 0 0 0 20"
            fill="none"
            stroke="#000"
            stroke-opacity="0.08"
            stroke-width="1"
          />
        </pattern>
      </defs>
      <g
        [attr.transform]="
          'translate(' +
          editorStateService.panX +
          ' ' +
          editorStateService.panY +
          ') scale(' +
          editorStateService.zoom +
          ')'
        "
      >
        <rect
          x="-10000"
          y="-10000"
          width="20000"
          height="20000"
          fill="url(#grid)"
          pointer-events="none"
        />

        <!-- ROOMS -->
        @for (room of propertyService.property.rooms; track room.id) {
          <polygon
            [attr.points]="room.polygon.map((p) => p.x + ',' + p.y).join(' ')"
            [style.cursor]="'pointer'"
            fill="#e0e0e0"
            stroke="none"
            [attr.pointer-events]="
              editorStateService.activeTool === 'select' || editorStateService.activeTool === 'room'
                ? 'all'
                : 'none'
            "
            (click)="selectRoom(room.id, $event)"
          />
        }

        <!-- WALLS -->
        @for (wall of propertyService.property.walls; track wall.id) {
          <polygon
            [attr.points]="getWallPoints(wall)"
            [attr.fill]="editorStateService.selectedWallId === wall.id ? '#2196f3' : '#333'"
            class="wall"
            [attr.pointer-events]="editorStateService.activeTool === 'wall' ? 'none' : 'auto'"
            (click)="selectWall(wall.id, $event)"
          />

          <!-- WALL ENDPOINTS -->
          @if (editorStateService.selectedWallId === wall.id) {
            <circle
              [attr.cx]="wall.start.x"
              [attr.cy]="wall.start.y"
              r="10"
              fill="#2196f3"
              class="wall-handle"
              (mousedown)="startDragging($event, wall.id, 'start')"
            />

            <circle
              [attr.cx]="wall.end.x"
              [attr.cy]="wall.end.y"
              r="10"
              fill="#2196f3"
              class="wall-handle"
              (mousedown)="startDragging($event, wall.id, 'end')"
            />
          }
        }

        <!-- ROOM SELECTION OUTLINES -->
        @for (room of propertyService.property.rooms; track room.id) {
          @if (editorStateService.selectedRoomId === room.id) {
            <polygon
              [attr.points]="room.polygon.map((p) => p.x + ',' + p.y).join(' ')"
              fill="none"
              stroke="#2196f3"
              stroke-width="5"
              stroke-dasharray="8 5"
              pointer-events="none"
            />
          }
        }

        <!-- SNAP INDICATOR -->
        @if (editorStateService.snapTarget) {
          <circle
            [attr.cx]="editorStateService.snapTarget.x"
            [attr.cy]="editorStateService.snapTarget.y"
            r="14"
            fill="none"
            stroke="#2196f3"
            stroke-width="3"
            pointer-events="none"
          />
        }

        <!-- NEW WALL PREVIEW -->
        @if (
          editorStateService.activeTool === 'wall' &&
          editorStateService.drawingStart &&
          editorStateService.mousePosition
        ) {
          <line
            [attr.x1]="editorStateService.drawingStart.x"
            [attr.y1]="editorStateService.drawingStart.y"
            [attr.x2]="editorStateService.mousePosition.x"
            [attr.y2]="editorStateService.mousePosition.y"
            stroke="#2196f3"
            stroke-width="4"
            stroke-dasharray="10 5"
            pointer-events="none"
          />
        }

        <!-- DOORS -->
        @for (door of propertyService.property.doors; track door.id) {
          <g
            [attr.transform]="getDoorTransform(door)"
            class="door"
            [attr.pointer-events]="editorStateService.activeTool === 'select' ? 'auto' : 'none'"
            (click)="selectDoor(door.id, $event)"
            (mousedown)="startDraggingDoor($event, door.id)"
          >
            <!-- Door opening -->
            <rect x="-40" y="-6" width="80" height="12" fill="white" />

            <!-- Door panel -->
            <line
              x1="-40"
              y1="0"
              x2="40"
              y2="0"
              [attr.stroke]="editorStateService.selectedDoorId === door.id ? '#2196f3' : '#8b4513'"
              stroke-width="6"
            />

            <!-- Swing arc -->
            <path
              d="M -40 0 A 80 80 0 0 1 40 80"
              fill="none"
              [attr.stroke]="editorStateService.selectedDoorId === door.id ? '#2196f3' : '#8b4513'"
              stroke-width="2"
            />

            <!-- Selection indicator -->
            @if (editorStateService.selectedDoorId === door.id) {
              <circle
                cx="0"
                cy="0"
                r="12"
                fill="none"
                stroke="#2196f3"
                stroke-width="2"
                pointer-events="none"
              />
            }
          </g>
        }
        <!-- DOOR PLACEMENT PREVIEW -->
        @if (editorStateService.activeTool === 'door' && placementPreview) {
          <g
            [attr.transform]="getPlacementTransform()"
            class="door placement-preview"
            pointer-events="none"
          >
            <!-- Opening -->
            <rect x="-40" y="-6" width="80" height="12" fill="white" />

            <!-- Door panel -->
            <line x1="-40" y1="0" x2="40" y2="0" stroke="#2196f3" stroke-width="6" />

            <!-- Swing -->
            <path d="M -40 0 A 80 80 0 0 1 40 80" fill="none" stroke="#2196f3" stroke-width="2" />
          </g>
        }
        <!-- WINDOWS -->
        @for (window of propertyService.property.windows; track window.id) {
          <g
            [attr.transform]="getWindowTransform(window)"
            class="window"
            [attr.pointer-events]="editorStateService.activeTool === 'select' ? 'auto' : 'none'"
            (click)="selectWindow(window.id, $event)"
            (mousedown)="startDraggingWindow($event, window.id)"
          >
            <!-- Opening -->
            <rect x="-50" y="-7" width="100" height="14" fill="white" />

            <!-- Glass -->
            <rect
              x="-45"
              y="-4"
              width="90"
              height="8"
              [attr.fill]="
                editorStateService.selectedWindowId === window.id ? '#2196f3' : '#60a5fa'
              "
            />

            <!-- Frame -->
            <line x1="-50" y1="-7" x2="50" y2="-7" stroke="#555" stroke-width="3" />

            <line x1="-50" y1="7" x2="50" y2="7" stroke="#555" stroke-width="3" />

            @if (editorStateService.selectedWindowId === window.id) {
              <rect
                x="-58"
                y="-15"
                width="116"
                height="30"
                fill="none"
                stroke="#2196f3"
                stroke-width="2"
              />
            }
          </g>
        }
        <!-- WINDOW PLACEMENT PREVIEW -->
        @if (editorStateService.activeTool === 'window' && placementPreview) {
          <g
            [attr.transform]="getPlacementTransform()"
            class="window placement-preview"
            pointer-events="none"
          >
            <!-- Opening -->
            <rect x="-50" y="-7" width="100" height="14" fill="white" />

            <!-- Glass -->
            <rect x="-45" y="-4" width="90" height="8" fill="#60a5fa" />

            <!-- Frame -->
            <line x1="-50" y1="-7" x2="50" y2="-7" stroke="#2196f3" stroke-width="3" />

            <line x1="-50" y1="7" x2="50" y2="7" stroke="#2196f3" stroke-width="3" />
          </g>
        }
      </g>
    </svg>
  </div>
</div>
