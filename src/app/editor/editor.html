<div class="editor" [class]="getCursorClass()">
  <div class="toolbar">
    <button [class.active]="activeTool === 'select'" (click)="setTool('select')">Select</button>
    <button [class.active]="activeTool === 'wall'" (click)="setTool('wall')">Wall</button>
    <button [class.active]="activeTool === 'room'" (click)="setTool('room')">Room</button>
    <button [class.active]="activeTool === 'door'" (click)="setTool('door')">Door</button>
    <button [class.active]="activeTool === 'window'" (click)="setTool('window')">Window</button>
    <button [class.active]="activeTool === 'sensor'" (click)="setTool('sensor')">Sensor</button>
    <button
      [disabled]="!selectedWallId && !selectedDoorId && !selectedWindowId && !selectedRoomId"
      (click)="deleteSelected()"
      *ngIf="getSelectedType()"
    >
      Delete
    </button>
  </div>

  <div class="workspace">
    <div>Walls: {{ propertyService.property.walls.length }}</div>
    @if (selectedRoomId) {
      <div class="room-properties">
        <input [value]="getSelectedRoom()?.name ?? ''" (input)="renameSelectedRoom($event)" />

        <div>
          Area:
          {{ getSelectedRoom()?.area | number: '1.0-0' }}
        </div>
      </div>
    }
    <svg
      class="floor-plan"
      [class.drawing]="activeTool !== 'select'"
      viewBox="0 0 1000 700"
      preserveAspectRatio="xMidYMid meet"
      (click)="onSvgClick($event)"
      (mousemove)="onMouseMove($event)"
      (mouseup)="stopDragging()"
      (mouseleave)="stopDragging()"
    >
      <!-- ROOMS -->
      @for (room of propertyService.property.rooms; track room.id) {
        <polygon
          [attr.points]="room.polygon.map((p) => p.x + ',' + p.y).join(' ')"
          [attr.fill]="selectedRoomId === room.id ? '#bfdbfe' : '#dbeafe'"
          class="room"
          pointer-events="all"
          (click)="selectRoom(room.id, $event)"
        />
      }

      <!-- WALLS -->
      @for (wall of propertyService.property.walls; track wall.id) {
        <polygon
          [attr.points]="getWallPoints(wall)"
          [attr.fill]="selectedWallId === wall.id ? '#2196f3' : '#333'"
          class="wall"
          [attr.pointer-events]="activeTool === 'wall' ? 'none' : 'auto'"
          (click)="selectWall(wall.id, $event)"
        />

        <!-- WALL ENDPOINTS -->
        @if (selectedWallId === wall.id) {
          <circle
            [attr.cx]="wall.start.x"
            [attr.cy]="wall.start.y"
            r="10"
            fill="#2196f3"
            class="wall-handle"
            (mousedown)="startDragging($event, wall.id, 'start')"
          />

          <circle
            [attr.cx]="wall.end.x"
            [attr.cy]="wall.end.y"
            r="10"
            fill="#2196f3"
            class="wall-handle"
            (mousedown)="startDragging($event, wall.id, 'end')"
          />
        }
      }

      <!-- SNAP INDICATOR -->
      @if (snapTarget) {
        <circle
          [attr.cx]="snapTarget.x"
          [attr.cy]="snapTarget.y"
          r="14"
          fill="none"
          stroke="#2196f3"
          stroke-width="3"
          pointer-events="none"
        />
      }

      <!-- NEW WALL PREVIEW -->
      @if (activeTool === 'wall' && drawingStart && mousePosition) {
        <line
          [attr.x1]="drawingStart.x"
          [attr.y1]="drawingStart.y"
          [attr.x2]="mousePosition.x"
          [attr.y2]="mousePosition.y"
          stroke="#2196f3"
          stroke-width="4"
          stroke-dasharray="10 5"
          pointer-events="none"
        />
      }

      <!-- DOORS -->
      @for (door of propertyService.property.doors; track door.id) {
        <g
          [attr.transform]="getDoorTransform(door)"
          class="door"
          [attr.pointer-events]="activeTool === 'select' ? 'auto' : 'none'"
          (click)="selectDoor(door.id, $event)"
          (mousedown)="startDraggingDoor($event, door.id)"
        >
          <!-- Door opening -->
          <rect x="-40" y="-6" width="80" height="12" fill="white" />

          <!-- Door panel -->
          <line
            x1="-40"
            y1="0"
            x2="40"
            y2="0"
            [attr.stroke]="selectedDoorId === door.id ? '#2196f3' : '#8b4513'"
            stroke-width="6"
          />

          <!-- Swing arc -->
          <path
            d="M -40 0 A 80 80 0 0 1 40 80"
            fill="none"
            [attr.stroke]="selectedDoorId === door.id ? '#2196f3' : '#8b4513'"
            stroke-width="2"
          />

          <!-- Selection indicator -->
          @if (selectedDoorId === door.id) {
            <circle
              cx="0"
              cy="0"
              r="12"
              fill="none"
              stroke="#2196f3"
              stroke-width="2"
              pointer-events="none"
            />
          }
        </g>
      }
      <!-- DOOR PLACEMENT PREVIEW -->
      @if (activeTool === 'door' && placementPreview) {
        <g
          [attr.transform]="getPlacementTransform()"
          class="door placement-preview"
          pointer-events="none"
        >
          <!-- Opening -->
          <rect x="-40" y="-6" width="80" height="12" fill="white" />

          <!-- Door panel -->
          <line x1="-40" y1="0" x2="40" y2="0" stroke="#2196f3" stroke-width="6" />

          <!-- Swing -->
          <path d="M -40 0 A 80 80 0 0 1 40 80" fill="none" stroke="#2196f3" stroke-width="2" />
        </g>
      }
      <!-- WINDOWS -->
      @for (window of propertyService.property.windows; track window.id) {
        <g
          [attr.transform]="getWindowTransform(window)"
          class="window"
          [attr.pointer-events]="activeTool === 'select' ? 'auto' : 'none'"
          (click)="selectWindow(window.id, $event)"
          (mousedown)="startDraggingWindow($event, window.id)"
        >
          <!-- Opening -->
          <rect x="-50" y="-7" width="100" height="14" fill="white" />

          <!-- Glass -->
          <rect
            x="-45"
            y="-4"
            width="90"
            height="8"
            [attr.fill]="selectedWindowId === window.id ? '#2196f3' : '#60a5fa'"
          />

          <!-- Frame -->
          <line x1="-50" y1="-7" x2="50" y2="-7" stroke="#555" stroke-width="3" />

          <line x1="-50" y1="7" x2="50" y2="7" stroke="#555" stroke-width="3" />

          @if (selectedWindowId === window.id) {
            <rect
              x="-58"
              y="-15"
              width="116"
              height="30"
              fill="none"
              stroke="#2196f3"
              stroke-width="2"
            />
          }
        </g>
      }
      <!-- WINDOW PLACEMENT PREVIEW -->
      @if (activeTool === 'window' && placementPreview) {
        <g
          [attr.transform]="getPlacementTransform()"
          class="window placement-preview"
          pointer-events="none"
        >
          <!-- Opening -->
          <rect x="-50" y="-7" width="100" height="14" fill="white" />

          <!-- Glass -->
          <rect x="-45" y="-4" width="90" height="8" fill="#60a5fa" />

          <!-- Frame -->
          <line x1="-50" y1="-7" x2="50" y2="-7" stroke="#2196f3" stroke-width="3" />

          <line x1="-50" y1="7" x2="50" y2="7" stroke="#2196f3" stroke-width="3" />
        </g>
      }
    </svg>
  </div>
</div>
